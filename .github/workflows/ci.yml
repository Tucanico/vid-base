name: CI

on:
   push:
   pull_request:

jobs:
   check:
      runs-on: ubuntu-latest
      env:
         # The checks never launch Electron, so skip downloading its binary
         ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      steps:
         - uses: actions/checkout@v5
         - uses: actions/setup-node@v5
           with:
              node-version: 24
              cache: npm
         - run: npm ci
         - run: npm run typecheck
         - run: npm run lint
         - run: npm test
